[project]
name = "assistant"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "farmbetter-client",
    "isdasoil-api-client",
    "google-cloud-storage>=3.1.1",
    "google-cloud-texttospeech>=2.27.0",
    "loguru-logging-intercept>=0.1.5",
    "pydub>=0.25.1",
    "pywa[cryptography,fastapi]>=3.1.1",
    "upstash-redis>=1.4.0",
    "google-api-python-client>=2.176.0",
    "gql[httpx]>=4.0.0",
    "zep-cloud>=3.4.3",
    "phonenumbers>=9.0.4",
    "async-lru>=2.0.4",
    "pinecone>=7.3.0",
]

[dependency-groups]
dev = [
#    "basedpyright>0",
    "poethepoet>0",
    "pytest>0",
    "ruff>0",
]

[tool.uv.sources]
farmbetter-client = { workspace = true }
isdasoil-api-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
farmwise-agents = "farmwise.repl:main"
