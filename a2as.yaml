variables:
  LOG_MODULE_IMPORTS:
    type: env
    params:
      caller: [os.environ.get]
      path: [apps.farmbase.src.farmbase]
  OAUTHLIB_INSECURE_TRANSPORT:
    type: env
    params:
      caller: [os.environ]

files:
  ./:
    type: pattern
    actions: [read]
    params:
      patterns: ['*.json']
      caller: [main]
  .git:
    type: literal
    actions: [read]
    params:
      caller: [os.path.join]
      path: [path]
  .tif:
    type: literal
    actions: [write]
    params:
      caller: [tempfile.NamedTemporaryFile]
      delete: "False"
  _dir:
    type: literal
    actions: [read]
    params:
      caller: [Path(args.dir)]
  args.dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  crop_cycle_dir:
    type: variable
    actions: [read]
    params:
      caller: [crop_cycle_dir.glob]
  crops.json:
    type: literal
    actions: [read]
    params:
      caller: [main]
      path: [_dir]
  directory_path:
    type: variable
    actions: [read]
    params:
      caller: [os.listdir]
  events.json:
    type: literal
    actions: [read]
    params:
      caller: [main]
      path: [_dir]
  file_path:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  gcs_path:
    type: variable
    actions: [read]
    params:
      caller: [fs.open]
  path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, fs.open]
  pathogen:
    type: variable
    actions: [read]
    params:
      caller: [Pathogen()]
  pathogens.json:
    type: literal
    actions: [read]
    params:
      caller: [main]
      path: [_dir]

networks:
  api.isda-africa.com:
    type: api
    actions: [GET]
    urls: [/]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [IsdaClient]
