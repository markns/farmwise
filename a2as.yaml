agents:
  agent:
    type: instance
    models: [gpt-4.1]
    params:
      function: get_or_create_agent_by_name
  crop_pathogen_diagnosis_agent:
    type: instance
    models: [gpt-4.1]
    tools: [available_courses]
    params:
      name: Crop pathogen diagnosis agent
      handoff_description: An agent that can identify crop pests and diseases from an image
      output_type: TextResponse
      instructions: [crop_pathogen_diagnosis_agent_instructions]
  crop_suitability_agent:
    type: instance
    models: [gpt-4.1]
    tools: [suitability_index, update_contact, soil_properties]
    params:
      name: Crop Suitability Agent
      handoff_description: A helpful agent that can answer questions about crop suitability.
      output_type: TextResponse
      instructions: [crop_suitability_agent_instructions]
  farm_registration_agent:
    type: instance
    models: [gpt-4.1]
    tools: [update_contact]
    params:
      name: Field Registration Agent
      handoff_description: This agent is used for registering a field in the system
      output_type: TextResponse
      instructions: [farm_registration_agent_instructions]
  maize_variety_selector:
    type: instance
    models: [gpt-4.1]
    tools: [elevation, soil_properties, aez_classification, growing_period, maize_varieties, update_contact]
    params:
      name: Maize Variety Selector
      handoff_description: An agent that can recommend suitable varieties of Maize
      output_type: TextResponse
      instructions: [maize_variety_selector_instructions]
  market_price_agent:
    type: instance
    models: [gpt-4.1]
    tools: [get_markets, get_market_price_snapshot]
    params:
      name: Market Price Agent
      handoff_description: Provides current market prices based on farm location and product interests.
      output_type: TextResponse
      instructions: [market_price_agent_instructions]
  onboarding_agent:
    type: instance
    models: [gpt-4.1]
    tools: [update_farmbetter_user]
    params:
      name: Onboarding Agent
      handoff_description: This agent is used for onboarding new users into the system
      model_settings: ModelSettings(tool_choice=auto)
      output_type: TextResponse
      instructions: [onboarding_agent_instructions]
  soil_advisor_agent:
    type: instance
    models: [gpt-4.1]
    tools: [soil_properties]
    params:
      name: Soil advisor
      handoff_description: An agent that can advises on soil management for farmers
      output_type: TextResponse
      instructions: [soil_advisory_instructions]
  triage_agent:
    type: instance
    models: [gpt-4.1]
    tools: [available_courses]
    params:
      name: Triage Agent
      output_type: TextResponse
      instructions: [triage_agent_instructions]

models:
  gpt-4.1:
    type: literal
    agents: [onboarding_agent, farm_registration_agent, crop_suitability_agent, maize_variety_selector, crop_pathogen_diagnosis_agent,
      market_price_agent, agent, triage_agent, soil_advisor_agent]

tools:
  aez_classification:
    type: variable
    agents: [maize_variety_selector]
    params:
      dynamic: "True"
      description: Get the AEZ (Agro-Ecological Zone) classification for a given geographical coordinate.
  available_courses:
    type: decorator
    agents: [crop_pathogen_diagnosis_agent, triage_agent]
    params:
      description: |-
        Fetches the list of available courses.

        This function retrieves all the courses and returns them in the form of
        `AvailableCourse` objects. Each course object includes a description and a flow button.

        Args:
            _: RunContextWrapper[UserContext]: The runtime context wrapper
                containing user-specific context and execution environment.

        Returns:
            list[AvailableCourse]: A list of courses represented as
                `AvailableCourse` objects, where each includes a course
                description and a flow button.
  create_farm:
    type: decorator
    params:
      description: |2

        Create a farm with an optional location, and associated contacts
  create_farmbetter_user:
    type: decorator
    params:
      description: |2

        Create a new FarmBetter user. Provide the details required by the FarmBetter API in the user payload.
  create_note:
    type: decorator
    params:
      description: |2

        Create a note with an optional location. Use the current contact's ID for the contact_id_created_by field.
  data_collection_consent:
    type: decorator
    params:
      description: Use this tool when the contact consents for data collection
  elevation:
    type: variable
    agents: [maize_variety_selector]
    params:
      dynamic: "True"
      description: |-
        Fetch the elevation in metres for a given location.

        Args:
            latitude: The latitude of the location.
            longitude: The longitude of the location.
  get_farmbetter_user:
    type: decorator
    params:
      description: |2

        Fetch a FarmBetter user by id, email, or phone number. Defaults to the current user in context when no lookup parameters are supplied.
  get_market_price_snapshot:
    type: decorator
    agents: [market_price_agent]
    params:
      description: "\nGet a snapshot of market prices for a given market,\n formatted as csv with commodities as rows and\
        \ price date as columns  \n"
  get_markets:
    type: decorator
    agents: [market_price_agent]
    params:
      description: |2

        Get the closest markets to a given coordinate
  growing_period:
    type: variable
    agents: [maize_variety_selector]
    params:
      dynamic: "True"
      description: Get the growing period length in days for a given geographical coordinate.
  maize_varieties:
    type: variable
    agents: [maize_variety_selector]
    params:
      dynamic: "True"
  soil_properties:
    type: variable
    agents: [crop_suitability_agent, maize_variety_selector, soil_advisor_agent]
    params:
      dynamic: "True"
      description: Fetch soil properties for a given location.
  suitability_index:
    type: variable
    agents: [crop_suitability_agent]
    params:
      dynamic: "True"
      description: Get the crop suitability index values for a given geographical coordinate.
  update_contact:
    type: variable
    agents: [farm_registration_agent, crop_suitability_agent, maize_variety_selector]
    params:
      dynamic: "True"
  update_farmbetter_user:
    type: variable
    agents: [onboarding_agent]
    params:
      dynamic: "True"

